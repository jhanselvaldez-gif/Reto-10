<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador de Paises</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/paises.css">

  <script src="js/paises.js" defer></script>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Comparador de Paises</span>
    </div>
  </nav>

  <main class="container my-4">

<p>Escriba el nombre de los paises que desea comparar<strong> en ingles</strong></p><br>


    <div class="row g-3 mb-4">
      <div class="col-md-5">
        <input type="text" id="pais1" class="form-control" placeholder="Primer pais (ej: peru)">
      </div>
      <div class="col-md-5">
        <input type="text" id="pais2" class="form-control" placeholder="Segundo pais (ej: chile)">
      </div>
      <div class="col-md-2 d-grid">
        <button id="btnComparar" class="btn btn-primary">Comparar</button>
      </div>
    </div>

    <div id="mensaje"></div>

    <div class="row g-4">
      <div class="col-md-6" id="resultado1"></div>
      <div class="col-md-6" id="resultado2"></div>
    </div>

  </main>

</body>
</html>
